name: Deploy - WPWebsiteFix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: mainsource
        run: npm install

      - name: Build Next.js
        working-directory: mainsource
        run: npm run build

      - name: Verify Build Output
        run: |
          if [ ! -f "mainsource/out/index.html" ]; then
            echo "Build failed: mainsource/out/index.html not found"
            exit 1
          fi

      - name: Replace Out Folder
        run: |
          rm -rf out
          cp -r mainsource/out ./out

      - name: Deploy To Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          script: |
            cd /home/u744877281/domains/wpwebsitefix.com/public_html

            find . -mindepth 1 -maxdepth 1 \
              ! -name ".git" \
              ! -name "mainsource" \
              ! -name "out" \
              -exec rm -rf {} +

            cp -a out/. .
